<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: Coinly near-black (#0F1115 family) -->
    <radialGradient id="bg" cx="38%" cy="28%" r="100%">
      <stop offset="0%" stop-color="#232830"/>
      <stop offset="45%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#08090c"/>
    </radialGradient>
    <linearGradient id="bgSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Emerald coin metal (#2ECC71 family) -->
    <linearGradient id="rimMetal" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#8df5b8"/>
      <stop offset="28%" stop-color="#43dd85"/>
      <stop offset="55%" stop-color="#25b463"/>
      <stop offset="80%" stop-color="#127a41"/>
      <stop offset="100%" stop-color="#0b5e31"/>
    </linearGradient>
    <radialGradient id="face" cx="36%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#b2ffd2"/>
      <stop offset="40%" stop-color="#4fdd8d"/>
      <stop offset="75%" stop-color="#2bbb68"/>
      <stop offset="100%" stop-color="#1d9a53"/>
    </radialGradient>
    <linearGradient id="bevelLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8ffe0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#4fdd8d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#074724" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Embossed monogram metal -->
    <linearGradient id="markMetal" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#0a5a2f"/>
      <stop offset="55%" stop-color="#0e6b39"/>
      <stop offset="100%" stop-color="#074524"/>
    </linearGradient>

    <filter id="coinShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="glowBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="65"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <clipPath id="faceClip">
      <circle cx="512" cy="500" r="292"/>
    </clipPath>
      <clipPath id="appShape">
      <rect width="1024" height="1024" rx="225"/>
    </clipPath>
  </defs>
  <g clip-path="url(#appShape)">

  <!-- ===== Background ===== -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#bgSheen)"/>
  <!-- emerald ambient glow behind coin -->
  <circle cx="512" cy="500" r="330" fill="#2ECC71" opacity="0.22" filter="url(#glowBlur)"/>

  <!-- ===== Coin shadow ===== -->
  <ellipse cx="512" cy="560" rx="330" ry="300" fill="#000000" opacity="0.5" filter="url(#coinShadow)"/>

  <!-- ===== Coin edge (side) ===== -->
  <circle cx="512" cy="510" r="352" fill="#063a1f"/>
  <circle cx="512" cy="504" r="352" fill="url(#rimMetal)"/>

  <!-- Reeded edge ticks -->
  <g stroke="#0a5a2f" stroke-width="7" opacity="0.55">
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(0 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(9 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(18 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(27 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(36 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(45 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(54 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(63 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(72 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(81 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(90 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(99 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(108 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(117 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(126 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(135 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(144 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(153 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(162 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(171 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(180 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(189 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(198 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(207 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(216 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(225 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(234 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(243 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(252 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(261 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(270 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(279 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(288 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(297 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(306 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(315 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(324 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(333 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(342 512 504)"/>
    <line x1="512" y1="156" x2="512" y2="188" transform="rotate(351 512 504)"/>
  </g>

  <!-- Bevel ring between rim and face -->
  <circle cx="512" cy="504" r="300" fill="none" stroke="url(#bevelLight)" stroke-width="16"/>

  <!-- ===== Coin face ===== -->
  <circle cx="512" cy="500" r="292" fill="url(#face)"/>
  <g clip-path="url(#faceClip)">
    <ellipse cx="512" cy="800" rx="360" ry="180" fill="#0b5e31" opacity="0.4" filter="url(#coinShadow)"/>
    <circle cx="512" cy="500" r="252" fill="none" stroke="#128a4a" stroke-width="2" opacity="0.4"/>
    <circle cx="512" cy="500" r="230" fill="none" stroke="#b9ffd6" stroke-width="1.6" opacity="0.35"/>
  </g>

  <!-- ===== Embossed "C" monogram (Coinly) ===== -->
  <!-- highlight offset (top-light emboss) -->
  <g transform="translate(0,-6)" opacity="0.8" filter="url(#soft1)">
    <path d="M 600 347.6 A 176 176 0 1 0 600 652.4"
          fill="none" stroke="#c8ffe0" stroke-width="96"
          stroke-linecap="round"/>
  </g>
  <!-- shadow offset -->
  <g transform="translate(0,7)" opacity="0.85" filter="url(#soft1)">
    <path d="M 600 347.6 A 176 176 0 1 0 600 652.4"
          fill="none" stroke="#053521" stroke-width="96"
          stroke-linecap="round"/>
  </g>
  <!-- main monogram -->
  <path d="M 600 347.6 A 176 176 0 1 0 600 652.4"
        fill="none" stroke="url(#markMetal)" stroke-width="96"
        stroke-linecap="round"/>

  <!-- ===== Specular highlight sweep ===== -->
  <g clip-path="url(#faceClip)">
    <ellipse cx="380" cy="300" rx="300" ry="150"
             fill="#ffffff" opacity="0.24" filter="url(#soft2)"
             transform="rotate(-28 380 300)"/>
  </g>
  <!-- glint on rim -->
  <path d="M 250 280 A 352 352 0 0 1 460 158" fill="none" stroke="#e8fff2"
        stroke-width="14" stroke-linecap="round" opacity="0.7" filter="url(#soft2)"/>
  </g>
</svg>
